<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Handy Talk: Real-Time ISL Translation">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Handy Talk">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" type="image/png" href="logo.png"/>
  <title>Handy Talk</title>
  
  <style>
    /* Dark Background to match your app theme */
    body {
      background-color: #0B0F19;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    /* Logo Animation */
    .loading-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-img {
      width: 150px;
      height: 150px;
      border-radius: 50%; /* Makes rectangle logo into circle */
      object-fit: cover;
      border: 3px solid #06B6D4;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }

    /* Simple Loading Spinner */
    .spinner {
      margin-top: 30px;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top: 4px solid #6366F1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(6, 182, 212, 0.8); }
      100% { transform: scale(0.95); box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Custom Loader -->
  <div class="loading-container" id="splash-screen">
    <img src="logo.png" class="logo-img" alt="Handy Talk Logo">
    <div class="spinner"></div>
  </div>

  <!-- Flutter Bootstrapper -->
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // Hide splash screen when Flutter app is loaded
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.display = 'none';
      }
    });
  </script>
</body>
</html>
