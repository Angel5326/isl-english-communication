name: flutter_app
description: A bidirectional ISL-English communication app.
publish_to: 'none' # Remove this line if you want to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'   # Required SDK constraint

dependencies:
  flutter:
    sdk: flutter

  # Core functionality
  camera: ^0.10.5
  image_picker: ^0.8.4
  web_socket_channel: ^2.2.0
  http: ^0.13.3
  provider: ^6.0.0
  video_player: ^2.2.5
  audioplayers: ^4.0.0
  path_provider: ^2.0.2
  sqflite: ^2.0.0+4
  # UI and utilities
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/videos/   # Placeholder for ISL video clips
    # - assets/fonts/  # Uncomment if you add custom fonts

  # fonts:
  #   - family: MyCustomFont
  #     fonts:
  #       - asset: assets/fonts/MyCustomFont.ttf